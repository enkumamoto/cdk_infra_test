name: Build & Deploy FastAPI

on:
  push:
    branches: ["main"]
    paths:
      - "app_fastapi/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
          aws-region: us-east-1

      - name: Get ECR repository URI from CloudFormation
        run: |
          ECR_URI=$(aws cloudformation describe-stacks \
            --stack-name CdkInfraTestStack \
            --query "Stacks[0].Outputs[?OutputKey=='EcrRepositoryUri'].OutputValue" \
            --output text)
          if [ -z "$ECR_URI" ]; then
            echo "::error::EcrRepositoryUri output not found in CloudFormation stack"
            exit 1
          fi
          echo "ECR_URI=$ECR_URI" >> $GITHUB_ENV

      - name: Login to ECR
        run: |
          ECR_REGISTRY=$(echo "$ECR_URI" | cut -d'/' -f1)
          aws ecr get-login-password \
            | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Build image
        run: |
          docker build -t fastapi-app app_fastapi/

      - name: Tag image
        run: |
          IMAGE_TAG="${{ github.sha }}"
          docker tag fastapi-app:latest "$ECR_URI:$IMAGE_TAG"
          docker tag fastapi-app:latest "$ECR_URI:latest"
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Push image
        run: |
          docker push "$ECR_URI:$IMAGE_TAG"
          docker push "$ECR_URI:latest"

      - name: Get ECS resource names from CloudFormation
        run: |
          ECS_CLUSTER=$(aws cloudformation describe-stacks \
            --stack-name CdkInfraTestStack \
            --query "Stacks[0].Outputs[?OutputKey=='EcsClusterName'].OutputValue" \
            --output text)
          ECS_SERVICE=$(aws cloudformation describe-stacks \
            --stack-name CdkInfraTestStack \
            --query "Stacks[0].Outputs[?OutputKey=='EcsServiceName'].OutputValue" \
            --output text)
          echo "ECS_CLUSTER=$ECS_CLUSTER" >> $GITHUB_ENV
          echo "ECS_SERVICE=$ECS_SERVICE" >> $GITHUB_ENV

      - name: Force new ECS deployment
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --force-new-deployment

      - name: Wait for ECS deployment to stabilise
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"
